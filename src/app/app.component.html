<header class="app-header">
  <div class="app-header__inner container">

    <ng-container *ngIf="(isAuthed$ | async); else noMenu">
      <button class="icon-btn" aria-label="Open Menu" (click)="toggleMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" height="22" viewBox="0 -960 960 960" width="22" fill="currentColor">
          <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
        </svg>
      </button>
    </ng-container>

    <ng-template #noMenu>
      <span style="width:38px;height:38px"></span>
    </ng-template>

    <h1 class="app-header__title">Projeto em Angular</h1>
    <span style="width:38px;height:38px"></span>
  </div>
</header>

<div class="overlay" *ngIf="menuOpen" (click)="closeMenu()"></div>

<aside class="drawer" [class.open]="menuOpen">
  <h3 class="drawer-title">Menu</h3>

  <button class="drawer-btn primary" (click)="goCreateProduct()">
    Cadastrar Produto
  </button>

  <button class="drawer-btn danger" (click)="logout()">
    Sair
  </button>
</aside>

<main class="container" style="padding: 24px 20px;">
  <router-outlet/>
</main>
