<div class="user-list-container">
  <header class="user-list-header">
    <h2 class="auth-title">Lista de Usuários</h2>

    <button class="btn btn--primary" type="button" (click)="goBack()">
      Voltar
    </button>
  </header>

  <ul class="user-list">
    <li *ngFor="let user of users" class="user-list-item">
      <strong>{{ user.name }}</strong> - {{ user.email }}
    </li>
  </ul>
</div>
