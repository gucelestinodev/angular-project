<section class="auth">
  <div class="card auth-card">
    <h2 class="auth-title">Login</h2>

    <form class="form" (ngSubmit)="login()" #loginForm="ngForm">
      <div class="input">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="nome@exemplo.com"
               name="email" [(ngModel)]="email" required />
      </div>

      <div class="input">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="********"
               name="password" [(ngModel)]="password" required />
      </div>

      <div class="auth-actions">
        <button class="btn btn--primary" type="submit" [disabled]="loginForm.invalid">
          Entrar
        </button>

        <button class="btn btn--secondary" type="button" (click)="navigateToRegister()">
          Criar Cadastro
        </button>
      </div>
    </form>
  </div>
</section>
