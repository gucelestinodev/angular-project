<section class="grid" style="gap: var(--gap-lg);">
  <header style="display:flex; align-items:center; justify-content:space-between;">
    <h2 class="auth-title" style="margin:0">Lista de Produtos</h2>
    <button class="btn btn--primary" (click)="navigateToCreateProduct()">Cadastrar Produto</button>
  </header>

  <ul class="grid grid--cards" style="list-style:none; padding:0; margin:0;">
    <li *ngFor="let product of products" class="card card--hover" style="overflow:hidden;">
      <figure style="margin:0;">
        <img [src]="'assets/images/image.png'" [alt]="product.name"
             style="display:block; width:100%; aspect-ratio: 16/10; object-fit: cover;">
      </figure>

      <div style="padding:16px; display:grid; gap:8px;">
        <strong style="font-size:18px;">{{ product.name }}</strong>
        <p style="margin:0; color: var(--muted)">{{ product.description }}</p>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:6px;">
          <span style="font-weight:700;">R$ {{ product.price | number:'1.2-2' }}</span>
          <button class="btn btn--ghost">Detalhes</button>
        </div>
      </div>
    </li>
  </ul>
</section>
