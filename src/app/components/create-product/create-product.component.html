<section class="auth">
  <div class="card auth-card">
    <h2 class="auth-title">Cadastrar Produto</h2>

    <form class="form" (ngSubmit)="createProduct()" #productForm="ngForm">

      <div class="input">
        <label for="name">Nome</label>
        <input id="name" type="text" placeholder="Nome do produto"
               name="name" [(ngModel)]="product.name" required />
      </div>

      <div class="input">
        <label for="description">Descrição</label>
        <textarea id="description" placeholder="Descrição detalhada"
               name="description" [(ngModel)]="product.description" required></textarea>
      </div>

      <div class="input">
        <label for="price">Preço</label>
        <input id="price" type="number" placeholder="0.00"
               name="price" [(ngModel)]="product.price" required />
      </div>

      <div class="input">
        <label for="image">Imagem (URL)</label>
        <input id="image" type="text" placeholder="https://imagem.com/produto.png"
               name="image" [(ngModel)]="product.image" />
      </div>

      <div class="input">
        <label for="category">Categoria</label>
        <input id="category" type="text" placeholder="Ex: Eletrônicos"
               name="category" [(ngModel)]="product.category" />
      </div>

      <div class="input">
        <label for="countInStock">Estoque</label>
        <input id="countInStock" type="number" placeholder="0"
               name="countInStock" [(ngModel)]="product.countInStock" required />
      </div>

      <div class="input">
        <label for="brand">Marca</label>
        <input id="brand" type="text" placeholder="Marca do produto"
               name="brand" [(ngModel)]="product.brand" />
      </div>

      <div class="auth-actions">
        <button class="btn btn--primary" type="submit" [disabled]="productForm.invalid">
          Criar Produto
        </button>

        <button class="btn btn--secondary" type="button" (click)="goBack()">
          Voltar
        </button>
      </div>

    </form>
  </div>
</section>
